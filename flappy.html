<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Flap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: white;
            text-align: center;
        }
        .btn {
            pointer-events: auto;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            border: none;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
            background: #0ea5e9;
        }
        
        .score-box {
            position: absolute;
            top: 20px;
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            width: 100%;
            pointer-events: none;
        }
        .voice-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            cursor: pointer;
        }
        .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-animation 1.5s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="score-display" class="score-box">0</div>
        
        <!-- START SCREEN -->
        <div id="start-screen" class="flex flex-col items-center">
            <h1 class="text-5xl font-black mb-4 text-sky-400">NEON FLAP</h1>
            <div class="mb-4">
                <img src="Screenshot_2026-03-23_141147-removebg-preview.png" alt="Chick" class="w-24 h-24 animate-bounce">
            </div>
            <p class="text-slate-400 text-sm mb-2">Press Space or Tap to Jump</p>
            <p class="text-sky-400 text-xs font-bold uppercase tracking-widest">Or Say "Up" / "Down"</p>
            <button class="btn" id="start-btn">START GAME</button>
        </div>

        <!-- VOICE TOGGLE -->
        <div id="voice-toggle" class="voice-indicator" onclick="toggleVoiceControl()">
            <div id="voice-pulse" class="hidden pulse"></div>
            <span id="voice-status">Voice Control: OFF</span>
        </div>

        <div id="game-over-screen" class="hidden flex flex-col items-center">
            <h2 class="text-4xl font-black mb-2 text-rose-500">GAME OVER</h2>
            <p id="final-score" class="text-2xl mb-1">Score: 0</p>
            <p id="high-score" class="text-slate-400 mb-4">Best: 0</p>
            <button class="btn" id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreTxt = document.getElementById('final-score');
        const highScoreTxt = document.getElementById('high-score');
        const voiceStatus = document.getElementById('voice-status');
        const voicePulse = document.getElementById('voice-pulse');
        
        // Character Image Setup
        let chickLoaded = false;
        const chickImg = new Image();
        chickImg.onload = () => {
            chickLoaded = true;
            draw();
        };
        chickImg.src = 'Screenshot_2026-03-23_141147-removebg-preview.png';

        // Audio Setup
        const sfxJump = new Audio('squawk.mp3');
        const sfxScore = new Audio('combo.mp3');
        const sfxHit = new Audio('punch.mp3');

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => {});
        }

        const GRAVITY = 0.22;
        const JUMP_STRENGTH = -4.5;
        const DIVE_STRENGTH = 4.0;
        const PIPE_SPEED = 1.8;
        const PIPE_SPAWN_RATE = 110;
        const PIPE_WIDTH = 45;
        const GAP_HEIGHT = 180;

        // Game State
        let bird = { x: 50, y: 0, velocity: 0, radius: 22 }; 
        let pipes = [];
        let score = 0;
        let highscore = localStorage.getItem('neon-flap-best') || 0;
        let frameCount = 0;
        let isGameOver = false;
        let isGameStarted = false;
        let animationId;
        let isVoiceEnabled = false;

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const last = event.results.length - 1;
                const command = event.results[last][0].transcript.toLowerCase().trim();
                
                console.log('Voice Command:', command);
                
                if (command.includes('up')) {
                    jump();
                } else if (command.includes('down')) {
                    dive();
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                if (isVoiceEnabled) {
                    setTimeout(() => recognition.start(), 1000); // Attempt restart
                }
            };

            recognition.onend = () => {
                if (isVoiceEnabled) recognition.start(); // Keep listening
            };
        }

        function toggleVoiceControl() {
            if (!recognition) {
                alert("Speech recognition not supported in this browser.");
                return;
            }

            isVoiceEnabled = !isVoiceEnabled;
            if (isVoiceEnabled) {
                recognition.start();
                voiceStatus.innerText = "Voice Control: ON (Say Up/Down)";
                voicePulse.classList.remove('hidden');
            } else {
                recognition.stop();
                voiceStatus.innerText = "Voice Control: OFF";
                voicePulse.classList.add('hidden');
            }
        }

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 450);
            canvas.height = window.innerHeight;
            bird.x = canvas.width / 4;
            if (!isGameStarted) bird.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createPipe() {
            const minHeight = 60;
            const range = canvas.height - GAP_HEIGHT - (minHeight * 2);
            pipes.push({ x: canvas.width, top: minHeight + Math.random() * range, passed: false });
        }

        function jump() {
            if (!isGameStarted) {
                startGame();
            } else if (!isGameOver) {
                bird.velocity = JUMP_STRENGTH;
                playSound(sfxJump);
            }
        }

        function dive() {
            if (isGameStarted && !isGameOver) {
                bird.velocity = DIVE_STRENGTH;
            }
        }

        function startGame() {
            isGameStarted = true;
            isGameOver = false;
            score = 0;
            pipes = [];
            frameCount = 0;
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.innerText = "0";
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function triggerGameOver() {
            if (isGameOver) return;
            isGameOver = true;
            playSound(sfxHit);
            
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('neon-flap-best', highscore);
            }
            finalScoreTxt.innerText = `Score: ${score}`;
            highScoreTxt.innerText = `Best: ${highscore}`;
            gameOverScreen.classList.remove('hidden');
        }

        function update() {
            if (isGameOver) return;
            bird.velocity += GRAVITY;
            bird.y += bird.velocity;
            
            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) triggerGameOver();
            
            if (frameCount % PIPE_SPAWN_RATE === 0) createPipe();
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= PIPE_SPEED;
                
                const birdHitboxWidth = bird.radius * 1.5;
                const birdHitboxHeight = bird.radius * 1.5;

                if (bird.x + birdHitboxWidth/2 > p.x && bird.x - birdHitboxWidth/2 < p.x + PIPE_WIDTH) {
                    if (bird.y - birdHitboxHeight/2 < p.top || bird.y + birdHitboxHeight/2 > p.top + GAP_HEIGHT) {
                        triggerGameOver();
                    }
                }
                
                if (!p.passed && bird.x > p.x + PIPE_WIDTH) {
                    score++;
                    p.passed = true;
                    scoreDisplay.innerText = score;
                    playSound(sfxScore);
                }
                
                if (p.x + PIPE_WIDTH < 0) pipes.splice(i, 1);
            }
            frameCount++;
        }

        function drawBird() {
            if (!chickLoaded) return;
            
            ctx.save();
            ctx.translate(bird.x, bird.y);
            
            let rotation = isGameStarted ? Math.min(Math.PI / 8, Math.max(-Math.PI / 8, bird.velocity * 0.08)) : 0;
            ctx.rotate(rotation);
            
            const drawSize = bird.radius * 3.5;
            ctx.drawImage(chickImg, -drawSize/2, -drawSize/2, drawSize, drawSize);
            
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            pipes.forEach(p => {
                ctx.fillStyle = '#38bdf8';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0ea5e9';
                roundRect(ctx, p.x, 0, PIPE_WIDTH, p.top, 6);
                roundRect(ctx, p.x, p.top + GAP_HEIGHT, PIPE_WIDTH, canvas.height - (p.top + GAP_HEIGHT), 6);
                ctx.shadowBlur = 0;
            });
            
            drawBird();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath(); 
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) animationId = requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
            if (e.code === 'ArrowDown') { e.preventDefault(); dive(); }
        });
        canvas.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener('touchstart', (e) => { 
            if (e.target.tagName !== 'BUTTON' && e.target.id !== 'voice-toggle') { 
                e.preventDefault(); 
                jump(); 
            }
        }, { passive: false });

        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = startGame;
        
        draw();
    </script>
</body>
</html>
