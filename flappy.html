<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Flap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: white;
            text-align: center;
        }
        .btn {
            pointer-events: auto;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            border: none;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
            background: #0ea5e9;
        }
        
        .score-box {
            position: absolute;
            top: 20px;
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            width: 100%;
            pointer-events: none;
        }
        .voice-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            cursor: pointer;
            min-width: 220px;
            justify-content: center;
        }
        .vol-meter {
            width: 40px;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-left: 5px;
        }
        #vol-level {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.1s;
        }
        .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-animation 1.5s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .hidden { display: none !important; }

        .training-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="score-display" class="score-box">0</div>
        
        <!-- START SCREEN -->
        <div id="start-screen" class="flex flex-col items-center">
            <h1 class="text-5xl font-black mb-4 text-sky-400">NEON FLAP</h1>
            <div class="mb-4">
                <img src="Screenshot_2026-03-23_141147-removebg-preview.png" alt="Chick" class="w-24 h-24 animate-bounce">
            </div>
            <p class="text-slate-400 text-sm mb-2">Press Space or Tap to Jump</p>
            <p class="text-sky-400 text-xs font-bold uppercase tracking-widest">Or Make a Loud Sound</p>
            
            <div class="training-box">
                <p class="text-[10px] text-slate-500 uppercase mb-2">Voice Guide</p>
                <button onclick="playVoiceExample()" class="flex items-center gap-2 text-xs text-white bg-slate-700 px-3 py-1.5 rounded-full hover:bg-slate-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    Listen to "Up" Example
                </button>
                <p class="text-[9px] text-slate-500 mt-2 italic">A short sharp sound works best!</p>
            </div>

            <button class="btn" id="start-btn">START GAME</button>
        </div>

        <!-- VOICE TOGGLE -->
        <div id="voice-toggle" class="voice-indicator" onclick="initAudioControl()">
            <div id="voice-pulse" class="hidden pulse"></div>
            <span id="voice-status">Enable Mic Control</span>
            <div id="vol-container" class="vol-meter hidden">
                <div id="vol-level"></div>
            </div>
        </div>

        <div id="game-over-screen" class="hidden flex flex-col items-center">
            <h2 class="text-4xl font-black mb-2 text-rose-500">GAME OVER</h2>
            <p id="final-score" class="text-2xl mb-1">Score: 0</p>
            <p id="high-score" class="text-slate-400 mb-4">Best: 0</p>
            <button class="btn" id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreTxt = document.getElementById('final-score');
        const highScoreTxt = document.getElementById('high-score');
        const voiceStatus = document.getElementById('voice-status');
        const voicePulse = document.getElementById('voice-pulse');
        const volLevel = document.getElementById('vol-level');
        const volContainer = document.getElementById('vol-container');
        
        // Character Image Setup
        let chickLoaded = false;
        const chickImg = new Image();
        chickImg.onload = () => {
            chickLoaded = true;
            draw();
        };
        chickImg.src = 'Screenshot_2026-03-23_141147-removebg-preview.png';

        // Audio SFX Setup
        const sfxJump = new Audio('squawk.mp3');
        const sfxScore = new Audio('combo.mp3');
        const sfxHit = new Audio('punch.mp3');
        const sfxExample = new Audio('voice_115381.aac');

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => {});
        }

        function playVoiceExample() {
            playSound(sfxExample);
        }

        const GRAVITY = 0.22;
        const JUMP_STRENGTH = -4.5;
        const PIPE_SPEED = 1.8;
        const PIPE_SPAWN_RATE = 110;
        const PIPE_WIDTH = 45;
        const GAP_HEIGHT = 180;

        // Game State
        let bird = { x: 50, y: 0, velocity: 0, radius: 22 }; 
        let pipes = [];
        let score = 0;
        let highscore = localStorage.getItem('neon-flap-best') || 0;
        let frameCount = 0;
        let isGameOver = false;
        let isGameStarted = false;
        let animationId;
        
        // --- REAL-TIME AUDIO ENGINE ---
        let audioContext;
        let analyzer;
        let microphone;
        let dataArray;
        let isAudioInit = false;
        let lastJumpTime = 0;
        const JUMP_COOLDOWN = 150; // ms between jumps
        const VOLUME_THRESHOLD = 45; // Adjust based on background noise

        async function initAudioControl() {
            if (isAudioInit) return; // Prevent multiple initializations

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyzer = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                analyzer.fftSize = 256;
                const bufferLength = analyzer.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                microphone.connect(analyzer);
                
                isAudioInit = true;
                voiceStatus.innerText = "Mic Active (Shout to Jump)";
                voicePulse.classList.remove('hidden');
                volContainer.classList.remove('hidden');
                
                analyzeAudio();
            } catch (err) {
                console.error("Mic access denied or error:", err);
                voiceStatus.innerText = "Mic Denied (Tap to Play)";
            }
        }

        function analyzeAudio() {
            if (!isAudioInit) return;
            
            analyzer.getByteFrequencyData(dataArray);
            
            // Calculate average volume (RMS-ish)
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;
            
            // Update Visual Meter
            let visualLevel = Math.min(100, (average / 100) * 100);
            volLevel.style.width = visualLevel + "%";
            volLevel.style.background = average > VOLUME_THRESHOLD ? "#f43f5e" : "#22c55e";

            // Trigger Jump if loud enough and not in cooldown
            if (average > VOLUME_THRESHOLD) {
                const now = Date.now();
                if (now - lastJumpTime > JUMP_COOLDOWN) {
                    jump();
                    lastJumpTime = now;
                }
            }

            requestAnimationFrame(analyzeAudio);
        }
        // ------------------------------

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 450);
            canvas.height = window.innerHeight;
            bird.x = canvas.width / 4;
            if (!isGameStarted) bird.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createPipe() {
            const minHeight = 60;
            const range = canvas.height - GAP_HEIGHT - (minHeight * 2);
            pipes.push({ x: canvas.width, top: minHeight + Math.random() * range, passed: false });
        }

        function jump() {
            if (!isGameStarted) {
                startGame();
            } else if (!isGameOver) {
                bird.velocity = JUMP_STRENGTH;
                playSound(sfxJump);
            }
        }

        function startGame() {
            // Safety check for AudioContext (browsers block it until user interaction)
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            isGameStarted = true;
            isGameOver = false;
            score = 0;
            pipes = [];
            frameCount = 0;
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.innerText = "0";
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function triggerGameOver() {
            if (isGameOver) return;
            isGameOver = true;
            playSound(sfxHit);
            
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('neon-flap-best', highscore);
            }
            finalScoreTxt.innerText = `Score: ${score}`;
            highScoreTxt.innerText = `Best: ${highscore}`;
            gameOverScreen.classList.remove('hidden');
        }

        function update() {
            if (isGameOver) return;
            bird.velocity += GRAVITY;
            bird.y += bird.velocity;
            
            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) triggerGameOver();
            
            if (frameCount % PIPE_SPAWN_RATE === 0) createPipe();
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= PIPE_SPEED;
                
                const birdHitboxWidth = bird.radius * 1.3;
                const birdHitboxHeight = bird.radius * 1.3;

                if (bird.x + birdHitboxWidth/2 > p.x && bird.x - birdHitboxWidth/2 < p.x + PIPE_WIDTH) {
                    if (bird.y - birdHitboxHeight/2 < p.top || bird.y + birdHitboxHeight/2 > p.top + GAP_HEIGHT) {
                        triggerGameOver();
                    }
                }
                
                if (!p.passed && bird.x > p.x + PIPE_WIDTH) {
                    score++;
                    p.passed = true;
                    scoreDisplay.innerText = score;
                    playSound(sfxScore);
                }
                
                if (p.x + PIPE_WIDTH < 0) pipes.splice(i, 1);
            }
            frameCount++;
        }

        function drawBird() {
            if (!chickLoaded) return;
            
            ctx.save();
            ctx.translate(bird.x, bird.y);
            
            let rotation = isGameStarted ? Math.min(Math.PI / 8, Math.max(-Math.PI / 8, bird.velocity * 0.08)) : 0;
            ctx.rotate(rotation);
            
            const drawSize = bird.radius * 3.5;
            ctx.drawImage(chickImg, -drawSize/2, -drawSize/2, drawSize, drawSize);
            
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            pipes.forEach(p => {
                ctx.fillStyle = '#38bdf8';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0ea5e9';
                roundRect(ctx, p.x, 0, PIPE_WIDTH, p.top, 6);
                roundRect(ctx, p.x, p.top + GAP_HEIGHT, PIPE_WIDTH, canvas.height - (p.top + GAP_HEIGHT), 6);
                ctx.shadowBlur = 0;
            });
            
            drawBird();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath(); 
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) animationId = requestAnimationFrame(gameLoop);
        }

        // Standard listeners
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
        });
        canvas.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener('touchstart', (e) => { 
            if (e.target.tagName !== 'BUTTON' && e.target.id !== 'voice-toggle') { 
                e.preventDefault(); 
                jump(); 
            }
        }, { passive: false });

        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = startGame;
        
        window.playVoiceExample = playVoiceExample;
        window.initAudioControl = initAudioControl;

        draw();
    </script>
</body>
</html>
